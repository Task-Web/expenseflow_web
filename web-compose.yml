services:
  expenseflow_web_backend:
    build:
      context: ./backend
    environment:
      - API_PREFIX=/api
      - ENV=production
      - FILE_STORAGE_DIR=/data/files
    expose:
      - "8000"
    volumes:
      - ./STATE.md:/app/STATE.md:ro
      - expenseflow_web_files:/data/files
    networks:
      - web

  expenseflow_web_frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    expose:
      - "80"
    networks:
      - web
    labels:
      caddy: "${CADDY_SCHEME-http://}expenseflow.${HOST_SUFFIX:-localhost}"
      caddy.0_reverse_proxy: "/api* expenseflow_web_backend:8000"
      caddy.1_reverse_proxy: "/mcp* expenseflow_web_backend:8000"
      caddy.2_reverse_proxy: "expenseflow_web_frontend:80"

volumes:
  expenseflow_web_files:
